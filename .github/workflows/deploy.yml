name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT: banded-totality-485901
  REGION: us-central1
  SERVICE: ai-hero-academy-b2c
  AR_REPO: ai-hero-academy

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Sync secrets to Secret Manager
        run: |
          CR_SA="387141525919-compute@developer.gserviceaccount.com"
          PROJECT="${{ env.GCP_PROJECT }}"

          sync_secret() {
            local name="$1" value="$2"
            if ! gcloud secrets describe "$name" --project="$PROJECT" --format=none 2>/dev/null; then
              gcloud secrets create "$name" --project="$PROJECT" --replication-policy=automatic --format=none
            fi
            printf '%s' "$value" | gcloud secrets versions add "$name" --project="$PROJECT" --data-file=- --format=none
            gcloud secrets add-iam-policy-binding "$name" \
              --project="$PROJECT" \
              --member="serviceAccount:${CR_SA}" \
              --role=roles/secretmanager.secretAccessor \
              --format=none
          }

          sync_secret "gemini-api-key" "${{ secrets.GEMINI_API_KEY }}"

          # Grant Cloud Run SA access to demo-token (already exists)
          gcloud secrets add-iam-policy-binding demo-token \
            --project="$PROJECT" \
            --member="serviceAccount:${CR_SA}" \
            --role=roles/secretmanager.secretAccessor \
            --format=none

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/b2c:${{ github.sha }}"
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ env.GCP_PROJECT }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            -t "$IMAGE" \
            .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          image: ${{ steps.build.outputs.image }}
          region: ${{ env.REGION }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --concurrency=80
          env_vars: |
            FIREBASE_ADMIN_PROJECT_ID=${{ env.GCP_PROJECT }}
          secrets: |
            GEMINI_API_KEY=gemini-api-key:latest
            DEMO_TOKEN=demo-token:latest

      - name: Print service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
