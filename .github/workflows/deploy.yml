name: Deploy to Databricks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sync and Deploy App
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: true

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify CLI authentication
        run: databricks auth env

      - name: Sync source files to Databricks workspace
        run: databricks sync . /Workspace/Users/hhu@edc.ca/my-ai-hero-academy-mvp

      - name: Deploy Databricks App
        run: |
          for attempt in 1 2 3 4; do
            databricks apps deploy my-ai-hero-academy-mvp \
              --source-code-path /Workspace/Users/hhu@edc.ca/my-ai-hero-academy-mvp && break
            if [ $attempt -lt 4 ]; then
              echo "Deploy blocked (attempt $attempt/4) — waiting 30s before retry..."
              sleep 30
            else
              echo "Deploy failed after 4 attempts."
              exit 1
            fi
          done
