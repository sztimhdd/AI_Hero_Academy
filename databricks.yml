# This is a Databricks asset bundle definition for my_ai_hero_academy_mvp.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: my_ai_hero_academy_mvp

# Seeding jobs — run once to create learner/system schemas and tables.
# Content is now served from JSON files in content/ (no seeding required).
# Usage:
#   databricks bundle deploy -t dev
#   databricks bundle run seed_00_create_schemas -t dev
#
# Runs in the Databricks cloud (serverless compute) — avoids local SSL proxy issues.
# Idempotent (safe to re-run).
resources:
  jobs:
    seed_00_create_schemas:
      name: "[seed] 00 - Create Schemas"
      queue:
        enabled: true
      max_concurrent_runs: 1
      tasks:
        - task_key: run_notebook
          notebook_task:
            notebook_path: ./notebooks/00_create_schemas.py
            source: WORKSPACE

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-2717931942638877.17.azuredatabricks.net

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://adb-2717931942638877.17.azuredatabricks.net
  #
